# Game Theory - payoff matrices (docs/SPEC.md section 5.1)
#
# Schema: app/ai/gametheory/encounters.py :: PayoffMatrix (T/R/P/S notation)
#   temptation (T) - defect while the partner cooperates
#   reward     (R) - both cooperate
#   punishment (P) - both defect
#   sucker     (S) - cooperate while the partner defects
#
# A genuine Prisoner's Dilemma needs T > R > P > S. The encounter resolver
# checks that and refuses to start with a matrix that is not a dilemma, so a
# typo here fails loudly instead of quietly producing a boring world.
#
# Payoffs are in "utility", converted to food, health and trust by the
# resolver. Edit freely: this file is the experiment.

prisoners_dilemma:
  temptation: 5.0
  reward: 3.0
  punishment: 1.0
  sucker: 0.0

# Deer needs two hunters. Cooperating together beats anything either can do
# alone, but being the only one who waits at the stag is the worst outcome -
# which is what makes trust worth having.
stag_hunt:
  temptation: 2.0
  reward: 6.0
  punishment: 1.5
  sucker: 0.0

# Fighting over a resource. Mutual aggression is the only negative payoff in
# the game: two hawks both get hurt.
hawk_dove:
  temptation: 4.0
  reward: 2.0
  punishment: -2.0
  sucker: 0.5

ultimatum:
  temptation: 4.0
  reward: 2.5
  punishment: 0.0
  sucker: 0.5
  fair_split: 0.4
  rejection_trust_penalty: 0.25

public_goods:
  temptation: 3.0
  reward: 2.5
  punishment: 0.5
  sucker: 0.0
  contribution: 2.0
  multiplier: 1.7

noise:
  # Chance an intended action comes out as its opposite. Axelrod's "trembling
  # hand": without it, Tit-for-Tat pairs never test forgiveness.
  trembling_hand: 0.02
