# Preset: LLM Schemers
# Overrides on top of config/default.yaml. Schema: WorldConfig.
# A handful of LLM minds among utility agents. They get a brighter body, speak
# out loud, and their plans bias their own utility scores - so manipulation
# shows up as speech bubbles before it shows up in the metrics.
# Works with Ollama running, and degrades to deterministic mock plans without.

name: LLM Schemers
scarcity: 1.4
population: 60
llm_agents: 6
initial_tribes: 0
trait_bias:
  cunning: 0.7
  charisma: 0.7
strategy_mix:
  LLM: 0.10
  TitForTat: 0.30
  AlwaysCooperate: 0.20
  Opportunist: 0.20
  AlwaysDefect: 0.20
