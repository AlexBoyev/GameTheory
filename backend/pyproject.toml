[project]
name = "gametheory-backend"
version = "0.1.0"
description = "Game Theory - autonomous 3D society simulation backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "jinja2>=3.1",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "opensimplex>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # bugbear
    "C4", # comprehensions
    "SIM", # simplify
    "ASYNC", # async misuse
    "ANN", # missing annotations
    "D", # docstrings
    "N", # naming
    "PTH", # prefer pathlib
    "TID", # tidy imports
    "RUF", # ruff-specific
]
ignore = [
    "D105", # magic-method docstrings: "Return the length" adds nothing
    "D107", # __init__ docstring - class docstring covers it
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN401"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opensimplex.*", "respx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes seconds rather than milliseconds (run with -m 'not slow' to skip)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/ai/llm/ollama_provider.py", "app/tools/*"]

# ---------------------------------------------------------------- import-linter
# Enforces the layering table in docs/SPEC.md section 2.1.

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (api > services > persistence > ai > sim)"
type = "layers"
layers = ["app.api", "app.services", "app.persistence", "app.ai", "app.sim"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "sim/ is pure: no transport, no persistence, no LLM providers"
type = "forbidden"
source_modules = ["app.sim"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "httpx",
    "sqlmodel",
    "sqlalchemy",
    "jinja2",
    "app.api",
    "app.services",
    "app.persistence",
    "app.ai.llm",
]

[[tool.importlinter.contracts]]
name = "sim/ is deterministic: no wall clock, no global RNG"
type = "forbidden"
source_modules = ["app.sim"]
forbidden_modules = ["time", "datetime", "random", "secrets", "uuid"]

[[tool.importlinter.contracts]]
name = "ai/ knows nothing about transport or storage"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlmodel",
    "sqlalchemy",
    "app.api",
    "app.services",
    "app.persistence",
]

[[tool.importlinter.contracts]]
name = "ai/llm/ receives DTOs, never sim internals"
type = "forbidden"
source_modules = ["app.ai.llm"]
forbidden_modules = ["app.sim"]

[[tool.importlinter.contracts]]
name = "services/ never imports transport"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "api/ talks to services, never to sim or ai internals"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.sim", "app.ai", "app.persistence"]
# Direct imports only: `api.deps` reaches the composition root, which by
# definition imports every layer. What matters is that no router or DTO names
# a sim/ai/persistence module itself.
allow_indirect_imports = true
